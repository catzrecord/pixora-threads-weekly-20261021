name: Threads six-month campaign

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify account/media or dispatch an approved due post
        type: choice
        default: check
        options: [check, preflight, due, roll, maintain]
  schedule:
    # WIB = UTC+7. Retry windows prevent a missed minute from losing a post.
    - cron: '30,40,50 1 * * *'
    - cron: '0,10,20,30 6,13 * * *'
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: pixora-weekly-1fatherx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      THREADS_TOKEN_VAULT_KEY: ${{ secrets.THREADS_TOKEN_VAULT_KEY }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
      PERSIST_GIT: '1'
      MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 14 * * *' && 'roll' || 'due') || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
        env:
          PERSIST_GIT: '0'
      - name: Refresh near-term source media and credential
        if: env.MODE == 'roll'
        run: |
          python publisher.py --mode maintain
          python -m pip install -r requirements-producer.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python producer.py
      - name: Dispatch or verify through official Threads API
        if: env.MODE != 'roll'
        run: python publisher.py --mode "$MODE"

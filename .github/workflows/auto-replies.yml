name: Threads comment auto replies
run-name: Threads auto replies ${{ inputs.mode || 'watch' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: check
        options: [check, scan, run, start, watch]
  schedule:
    # A fallback for an interrupted self-dispatch chain; avoid the top of the hour.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: pixora-1fatherx-auto-replies
  cancel-in-progress: false
jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      THREADS_TOKEN_VAULT_KEY: ${{ secrets.THREADS_TOKEN_VAULT_KEY }}
      AUTO_REPLY_ENABLED: ${{ vars.AUTO_REPLY_ENABLED }}
      PERSIST_GIT: '1'
      MODE: ${{ inputs.mode || 'watch' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record reply cycle start
        id: cycle
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
        env:
          PERSIST_GIT: '0'
      - name: Check or reply through the official Threads API
        run: |
          worker_mode="$MODE"
          if [ "$MODE" = 'start' ] || [ "$MODE" = 'watch' ]; then worker_mode='run'; fi
          python -u autoresponder.py --mode "$worker_mode"
      - name: Continue automatic reply checks
        if: ${{ always() && !cancelled() && (env.MODE == 'start' || env.MODE == 'watch') && env.AUTO_REPLY_ENABLED == 'true' }}
        run: python -u reply_clock.py --started-at "${{ steps.cycle.outputs.started_at }}"
